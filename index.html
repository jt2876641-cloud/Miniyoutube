<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" 
content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, shrink-to-fit=no">
  <title>MiniTube — Demo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">MiniTube</div>
    <div class="search">
      <input id="searchInput" type="search" placeholder="Buscar videos..." />
    </div>
    <button id="openUpload" class="btn">Subir</button>
  </header>

  <main class="container">
    <section class="player-area">
      <video id="mainPlayer" controls poster="" src="">
        Tu navegador no soporta video.
      </video>
      <div class="video-info">
        <h2 id="mainTitle">Selecciona un video</h2>
        <p id="mainDesc">Descripción del video seleccionado aparecerá aquí.</p>
        <div class="meta">
          <span id="likes">👍 0</span>
        </div>
      </div>
    </section>

    <aside class="sidebar">
      <h3>Videos</h3>
      <div id="videoList" class="video-list"></div>
    </aside>
  </main>

  <!-- Modal subir -->
  <div id="uploadModal" class="modal hidden">
    <div class="modal-card">
      <h3>Subir video (demo local)</h3>
      <form id="uploadForm">
        <label>Título<input name="title" required /></label>
        <label>Descripción<textarea name="desc"></textarea></label>
        <label>Elegir archivo de video
          <input name="file" type="file" accept="video/*" required />
        </label>
        <div class="modal-actions">
          <button type="submit" class="btn">Subir</button>
          <button id="cancelUpload" type="button" class="btn alt">Cancelar</button>
        </div>
      </form>
    </div>
  </div>

  // Import the functions you need from the SDKs you need
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js";
  import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-analytics.js";
  // TODO: Add SDKs for Firebase products that you want to use
  // https://firebase.google.com/docs/web/setup#available-libraries

  // Your web app's Firebase configuration
  // For Firebase JS SDK v7.20.0 and later, measurementId is optional

    apiKey: "AIzaSyBEAvs_u0sHy0-22LARXf4XsHxz6krfKfY",
    authDomain: "minitube-fcfe8.firebaseapp.com",
    projectId: "minitube-fcfe8",
    storageBucket: "minitube-fcfe8.firebasestorage.app",
    messagingSenderId: "866233576708",
    appId: "1:866233576708:web:11525ff1779c99a0657451",
    measurementId: "G-P5NZ1F3N9W"
  };

  // Initialize Firebase
  const app = initializeApp(firebaseConfig);
  const analytics = getAnalytics(app);
</script>

  <script src="script.js"></script>
</body>
</html>
